[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-forwarder"
version = "0.2.1"
description = "Personal Telegram channel monitor with regex filters and webhooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.34.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
tg-forwarder = "telegram_forwarder.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
